<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13795B" />
    <meta name="description" content="امسح المنتج الغذائي واعرف علاقته بخطر سرطان القولون، مع بدائل صحية وتذكير بالفحص." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clean Nutrition" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font loads WITHOUT blocking the first paint (system font is shown until it arrives) -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>Clean Nutrition · غذاء نظيف</title>
    <!-- Boot screen styles: shown instantly, before any JavaScript, so the page is never blank -->
    <style>
      html, body { margin: 0; background: #f6f5f0; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #13795b; text-align: center; padding: 24px; box-sizing: border-box; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(15, 118, 110, 0.25); }
      .boot-name { font-size: 1.25rem; font-weight: 700; }
      .boot-spin { width: 30px; height: 30px; border-radius: 50%; border: 4px solid #e5f4f1; border-top-color: #13795b; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-msg { display: none; max-width: 300px; color: #11302b; font-size: 0.95rem; line-height: 1.6; }
      .boot.slow .boot-msg { display: block; }
      .boot button { margin-top: 10px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 14px; background: #13795b; color: #fff; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot" role="status" aria-live="polite">
        <img src="/favicon.svg" alt="" />
        <div class="boot-name">غذاء نظيف · Clean Nutrition</div>
        <div class="boot-spin" aria-hidden="true"></div>
        <div class="boot-msg">
          <div>التطبيق يأخذ وقتاً أطول من المعتاد. تحقق من الإنترنت ثم أعد التحميل.</div>
          <div dir="ltr">Taking longer than usual. Check your connection and reload.</div>
          <button type="button" onclick="window.__hardReload && window.__hardReload()">أعد التحميل · Reload</button>
        </div>
      </div>
    </div>
    <script>
      // Boot watchdog: if the app has not started, offer a reload that also clears
      // stale offline caches (the usual cause of a stuck page right after a deploy).
      (function () {
        window.__appStarted = false;
        window.__hardReload = function () {
          var done = function () { location.reload(); };
          try {
            var jobs = [];
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(done, done);
            setTimeout(done, 3000);
          } catch (e) { done(); }
        };
        function showSlow() {
          if (window.__appStarted) return;
          var b = document.getElementById('boot');
          if (b) b.className = 'boot slow';
        }
        setTimeout(showSlow, 10000);
        // a script or stylesheet of the app failed to load -> show the reload option now
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet' && t.href.indexOf(location.host) > -1))) showSlow();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
